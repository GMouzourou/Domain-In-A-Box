---
# This NetworkAttachmentDefinition uses Multus to create a macvlan interface with a static IP for the domain controller.
# Remove it if your cluster already provides an equivalent attachment definition.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-network # Reference this name in pod annotations to request this network
  namespace: domain-in-a-box
spec:
  # Replace "eth0" with your actual host network interface name.
  # "address" sets the static IP address for the domain controller,
  # and "gateway" sets your network's default gateway/router IP address.
  # Add a subnet route as well so LAN-bound traffic stays on the macvlan
  # interface instead of being sent to the cluster's primary/default network.
  config: |-
    {
      "cniVersion": "0.4.0",
      "name": "macvlan-network",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.1.1/24",
            "gateway": "192.168.1.254"
          }
        ],
        "routes": [
          { "dst": "192.168.1.0/24", "gw": "192.168.1.254" }
        ]
      }
    }
---
# Create a Secret for the domain administrator password before applying in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: domain-in-a-box-secret
  namespace: domain-in-a-box
type: Opaque
stringData:
  domain-admin-password: "CHANGE_ME_BEFORE_APPLYING"
---
# This headless Service gives the StatefulSet a stable DNS identity inside the
# cluster. LAN clients should use the Multus/macvlan IP rather than this Service.
apiVersion: v1
kind: Service
metadata:
  name: domain-server-svc
  namespace: domain-in-a-box
spec:
  clusterIP: None # Headless service for StatefulSet.
  publishNotReadyAddresses: true
  selector:
    app: domain-in-a-box
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dhcp-server
      port: 67
      targetPort: 67
      protocol: UDP
    - name: dhcp-client
      port: 68
      targetPort: 68
      protocol: UDP
    - name: kerberos-tcp
      port: 88
      targetPort: 88
      protocol: TCP
    - name: kerberos-udp
      port: 88
      targetPort: 88
      protocol: UDP
    - name: ntp
      port: 123
      targetPort: 123
      protocol: UDP
    - name: rpc-epmap
      port: 135
      targetPort: 135
      protocol: TCP
    - name: netbios-ns
      port: 137
      targetPort: 137
      protocol: UDP
    - name: netbios-dgm
      port: 138
      targetPort: 138
      protocol: UDP
    - name: netbios-ssn
      port: 139
      targetPort: 139
      protocol: TCP
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: cldap
      port: 389
      targetPort: 389
      protocol: UDP
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
    - name: kpasswd-tcp
      port: 464
      targetPort: 464
      protocol: TCP
    - name: kpasswd-udp
      port: 464
      targetPort: 464
      protocol: UDP
    - name: ldaps
      port: 636
      targetPort: 636
      protocol: TCP
    - name: gc-tcp
      port: 3268
      targetPort: 3268
      protocol: TCP
    - name: gc-ssl
      port: 3269
      targetPort: 3269
      protocol: TCP
    - name: alt-dns-tcp
      port: 5353
      targetPort: 5353
      protocol: TCP
    - name: alt-dns-udp
      port: 5353
      targetPort: 5353
      protocol: UDP
    - name: stork-server
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dib-pdb
  namespace: domain-in-a-box
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: domain-in-a-box
---
# The StatefulSet defines a single replica of your domain controller with persistent volumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: domain-server
  namespace: domain-in-a-box
spec:
  serviceName: domain-server-svc
  replicas: 1
  selector:
    matchLabels:
      app: domain-in-a-box
  template:
    metadata:
      labels:
        app: domain-in-a-box
      annotations:
        # Annotation to request a static IP via Multus.
        # Update network name and desired IP as needed.
        k8s.v1.cni.cncf.io/networks: '[{ "name": "macvlan-network" }]'
    spec:
      # StatefulSets derive pod hostnames from the StatefulSet name and ordinal
      # (for example, `domain-server-0`), so a manual `hostname:` override
      # here will not behave like it does for a standalone Pod.
      #
      # hostname: domain-server
      # subdomain: domain-server-svc
      securityContext:
        runAsUser: 0
      containers:
        - name: domain-server
          image: gmouzourou/domain-in-a-box:latest
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          env:
            - name: DIB_REALM # Update with your Kerberos/AD realm.
              value: "HOME.ARPA"
            - name: DIB_DOMAIN # Update with your short domain name.
              value: "HOME"
            - name: DIB_DOMAIN_ADMIN_PASSWORD # Set the initial domain administrator password via Secret.
              valueFrom:
                secretKeyRef:
                  name: domain-in-a-box-secret
                  key: domain-admin-password
            - name: DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART # Set to true only if you want restart-time password sync from env.
              value: "false"
            - name: DIB_INTERFACE # Interface the container should bind Samba/BIND/Kea to.
              value: "net1" # Multus/macvlan secondary interface is usually `net1`.
            - name: DIB_DHCP_POOL # Define the DHCP lease pool; adjust as needed.
              value: "192.168.1.100-192.168.1.199"
            - name: DIB_DNS_FORWARDERS # Upstream DNS servers; adjust as needed.
              value: "1.1.1.1; 8.8.8.8;"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp-server
              containerPort: 67
              protocol: UDP
            - name: dhcp-client
              containerPort: 68
              protocol: UDP
            - name: kerberos-tcp
              containerPort: 88
              protocol: TCP
            - name: kerberos-udp
              containerPort: 88
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP
            - name: rpc-epmap
              containerPort: 135
              protocol: TCP
            - name: netbios-ns
              containerPort: 137
              protocol: UDP
            - name: netbios-dgm
              containerPort: 138
              protocol: UDP
            - name: netbios-ssn
              containerPort: 139
              protocol: TCP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: cldap
              containerPort: 389
              protocol: UDP
            - name: smb
              containerPort: 445
              protocol: TCP
            - name: kpasswd-tcp
              containerPort: 464
              protocol: TCP
            - name: kpasswd-udp
              containerPort: 464
              protocol: UDP
            - name: ldaps
              containerPort: 636
              protocol: TCP
            - name: gc-tcp
              containerPort: 3268
              protocol: TCP
            - name: gc-ssl
              containerPort: 3269
              protocol: TCP
            - name: alt-dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: alt-dns-udp
              containerPort: 5353
              protocol: UDP
            - name: stork-server
              containerPort: 8080
              protocol: TCP
          # Kubernetes does not support declaring a port *range* here, so allow
          # `DIB_RPC_PORT_RANGE` (default `49152-49252/tcp`) in your firewall,
          # load balancer, or CNI policy separately if external clients need it.
          #
          # Optional starting point for a small lab cluster. Adjust or remove to
          # match your node capacity and expected client load.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            exec:
              command: ["python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 389), 5); s.close()"]
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: bind-config
              mountPath: /etc/bind
            - name: bind-data
              mountPath: /var/cache/bind
            - name: chrony-config
              mountPath: /etc/chrony
            - name: chrony-data
              mountPath: /var/lib/chrony
            - name: kea-config
              mountPath: /etc/kea
            - name: kea-data
              mountPath: /var/lib/kea
            - name: stork-config
              mountPath: /etc/stork
            - name: stork-data
              mountPath: /var/lib/stork-agent
            - name: samba-data
              mountPath: /var/lib/samba
            - name: log-data
              mountPath: /var/log
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - domain-in-a-box
              topologyKey: "kubernetes.io/hostname"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
  volumeClaimTemplates:
    - metadata:
        name: bind-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
    - metadata:
        name: bind-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
    - metadata:
        name: chrony-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
    - metadata:
        name: chrony-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
    - metadata:
        name: kea-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
    - metadata:
        name: kea-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
    - metadata:
        name: stork-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
    - metadata:
        name: stork-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
    - metadata:
        name: samba-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: log-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
