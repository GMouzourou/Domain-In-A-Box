---
# This NetworkAttachmentDefinition uses Multus to create a macvlan interface with a static IP for the domain controller.
# Remove it if your cluster already provides an equivalent attachment definition.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-network # Reference this name in pod annotations to request this network
spec:
  # Replace "eth0" with your actual host network interface name.
  # "address" sets the static IP address for the domain controller,
  # and "gateway" sets your network's default gateway/router IP address.
  # Add a subnet route as well so LAN-bound traffic stays on the macvlan
  # interface instead of being sent to the cluster's primary/default network.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-network",
      "type": "macvlan",
      "mode": "bridge",
      "master": "eth0",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.1.1/24",
            "gateway": "192.168.1.254"
          }
        ],
        "routes": [
          { "dst": "192.168.1.0/24", "gw": "192.168.1.254" }
        ]
      }
    }
---
# Create a Secret for the domain administrator password before applying in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: domain-in-a-box-secret
type: Opaque
stringData:
  domain-admin-password: "CHANGE_ME_BEFORE_APPLYING"
---
# This headless Service gives the StatefulSet a stable DNS identity inside the
# cluster. LAN clients should use the Multus/macvlan IP rather than this Service.
apiVersion: v1
kind: Service
metadata:
  name: domain-controller-svc
spec:
  clusterIP: None # Headless service for StatefulSet.
  selector:
    app: domain-controller
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dhcp-server
      port: 67
      targetPort: 67
      protocol: UDP
    - name: dhcp-client
      port: 68
      targetPort: 68
      protocol: UDP
    - name: kerberos-tcp
      port: 88
      targetPort: 88
      protocol: TCP
    - name: kerberos-udp
      port: 88
      targetPort: 88
      protocol: UDP
    - name: ntp
      port: 123
      targetPort: 123
      protocol: UDP
    - name: rpc-epmap
      port: 135
      targetPort: 135
      protocol: TCP
    - name: netbios-ns
      port: 137
      targetPort: 137
      protocol: UDP
    - name: netbios-dgm
      port: 138
      targetPort: 138
      protocol: UDP
    - name: netbios-ssn
      port: 139
      targetPort: 139
      protocol: TCP
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: cldap
      port: 389
      targetPort: 389
      protocol: UDP
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
    - name: kpasswd-tcp
      port: 464
      targetPort: 464
      protocol: TCP
    - name: kpasswd-udp
      port: 464
      targetPort: 464
      protocol: UDP
    - name: ldaps
      port: 636
      targetPort: 636
      protocol: TCP
    - name: gc-tcp
      port: 3268
      targetPort: 3268
      protocol: TCP
    - name: gc-ssl
      port: 3269
      targetPort: 3269
      protocol: TCP
---
# The StatefulSet defines a single replica of your domain controller with persistent volumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: domain-controller
spec:
  serviceName: domain-controller-svc
  replicas: 1
  selector:
    matchLabels:
      app: domain-controller
  template:
    metadata:
      labels:
        app: domain-controller
      annotations:
        # Annotation to request a static IP via Multus.
        # Update network name and desired IP as needed.
        k8s.v1.cni.cncf.io/networks: '[{ "name": "macvlan-network" }]'
    spec:
      # StatefulSets derive pod hostnames from the StatefulSet name and ordinal
      # (for example, `domain-controller-0`), so a manual `hostname:` override
      # here will not behave like it does for a standalone Pod.
      #
      # hostname: domain-server
      # subdomain: domain-controller-svc
      containers:
        - name: domain-controller
          image: gmouzourou/domain-in-a-box:latest
          securityContext:
            privileged: true
          env:
            - name: DIB_REALM # Update with your Kerberos/AD realm.
              value: "HOME.ARPA"
            - name: DIB_DOMAIN # Update with your short domain name.
              value: "HOME"
            - name: DIB_DOMAIN_ADMIN_PASSWORD # Set the initial domain administrator password via Secret.
              valueFrom:
                secretKeyRef:
                  name: domain-in-a-box-secret
                  key: domain-admin-password
            - name: DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART # Set to true only if you want restart-time password sync from env.
              value: "false"
            - name: DIB_INTERFACE # Interface the container should bind Samba/BIND/Kea to.
              value: "net1" # Multus/macvlan secondary interface is usually `net1`.
            - name: DIB_DHCP_POOL # Define the DHCP lease pool; adjust as needed.
              value: "192.168.1.100-192.168.1.200"
            - name: DIB_DNS_FORWARDERS # Upstream DNS servers; adjust as needed.
              value: "1.1.1.1; 8.8.8.8;"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp-server
              containerPort: 67
              protocol: UDP
            - name: dhcp-client
              containerPort: 68
              protocol: UDP
            - name: kerberos-tcp
              containerPort: 88
              protocol: TCP
            - name: kerberos-udp
              containerPort: 88
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP
            - name: rpc-epmap
              containerPort: 135
              protocol: TCP
            - name: netbios-ns
              containerPort: 137
              protocol: UDP
            - name: netbios-dgm
              containerPort: 138
              protocol: UDP
            - name: netbios-ssn
              containerPort: 139
              protocol: TCP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: cldap
              containerPort: 389
              protocol: UDP
            - name: smb
              containerPort: 445
              protocol: TCP
            - name: kpasswd-tcp
              containerPort: 464
              protocol: TCP
            - name: kpasswd-udp
              containerPort: 464
              protocol: UDP
            - name: ldaps
              containerPort: 636
              protocol: TCP
            - name: gc-tcp
              containerPort: 3268
              protocol: TCP
            - name: gc-ssl
              containerPort: 3269
              protocol: TCP
          # Kubernetes does not support declaring a port *range* here, so allow
          # `DIB_RPC_PORT_RANGE` (default `49152-49252/tcp`) in your firewall,
          # load balancer, or CNI policy separately if external clients need it.
          #
          # Optional starting point for a small lab cluster. Adjust or remove to
          # match your node capacity and expected client load.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            exec:
              command: ["python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 389), 5); s.close()"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 389), 5); s.close()"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: dib-data
              mountPath: /etc/bind
              subPath: etc-bind
            - name: dib-data
              mountPath: /var/cache/bind
              subPath: var-cache-bind
            - name: dib-data
              mountPath: /etc/chrony
              subPath: etc-chrony
            - name: dib-data
              mountPath: /var/lib/chrony
              subPath: var-lib-chrony
            - name: dib-data
              mountPath: /etc/kea
              subPath: etc-kea
            - name: dib-data
              mountPath: /var/lib/kea
              subPath: var-lib-kea
            - name: dib-data
              mountPath: /etc/samba
              subPath: etc-samba
            - name: dib-data
              mountPath: /var/lib/samba
              subPath: var-lib-samba
            - name: log-data
              mountPath: /var/log
      initContainers:
        - name: init-log-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/samba/cores
              chmod 0700 /var/log/samba/cores
              touch /var/log/kea-dhcp4.log
              chmod 664 /var/log/kea-dhcp4.log
              chown root:_kea /var/log/kea-dhcp4.log
          volumeMounts:
            - name: log-data
              mountPath: /var/log
          securityContext:
            runAsUser: 0
  volumeClaimTemplates:
    - metadata:
        name: dib-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: log-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
