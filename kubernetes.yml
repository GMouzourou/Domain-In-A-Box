---
# This NetworkAttachmentDefinition uses Multus to create a macvlan interface with a static IP for the domain controller.
# Remove if you've already catered for this elsewhere in the your cluster.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-network # Reference this name in pod annotations to request this network
spec:
  # Replace "eth0" with your actual host network interface name.
  # "address" sets the static IP address for the domain controller,
  # and "gateway" set your network's default gateway/router IP address.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-network",
      "type": "macvlan",
      "mode": "bridge",
      "master": "eth0",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.1.1/24",
            "gateway": "192.168.1.254"
          }
        ]
      }
    }
---
# Create a Secret for the domain administrator password before applying in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: domain-in-a-box-secret
type: Opaque
stringData:
  domain-password: "CHANGE_ME_BEFORE_APPLYING"
---
# This headless Service gives the StatefulSet a stable DNS identity inside the
# cluster. LAN clients should use the Multus/macvlan IP rather than this Service.
apiVersion: v1
kind: Service
metadata:
  name: domain-controller-svc
spec:
  clusterIP: None # Headless service for StatefulSet.
  selector:
    app: domain-controller
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: kerberos-tcp
      port: 88
      targetPort: 88
      protocol: TCP
    - name: kerberos-udp
      port: 88
      targetPort: 88
      protocol: UDP
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
---
# The StatefulSet defines a single replica of your domain controller with persistent volumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: domain-controller
spec:
  serviceName: domain-controller-svc
  replicas: 1
  selector:
    matchLabels:
      app: domain-controller
  template:
    metadata:
      labels:
        app: domain-controller
      annotations:
        # Annotation to request a static IP via Multus.
        # Update network name and desired IP as needed.
        k8s.v1.cni.cncf.io/networks: '[{ "name": "macvlan-network", "ips": ["192.168.1.1"] }]'
    spec:
      hostname: domain-server # Set the pod’s hostname.
      subdomain: domain-controller-svc
      containers:
        - name: domain-controller
          image: gmouzourou/domain-in-a-box:latest
          securityContext:
            privileged: true
          env:
            - name: DIB_REALM # Update with your Kerberos/AD realm.
              value: "HOME.ARPA"
            - name: DIB_DOMAIN # Update with your short domain name.
              value: "HOME"
            - name: DIB_DOMAIN_PASSWORD # Set your initial domain administrator password via Secret.
              valueFrom:
                secretKeyRef:
                  name: domain-in-a-box-secret
                  key: domain-password
            - name: DIB_INTERFACE # Interface the container should bind Samba/BIND/Kea to.
              value: "net1" # Multus/macvlan secondary interface is usually `net1`.
            - name: DIB_DHCP_POOL # Define the DHCP lease pool; adjust as needed.
              value: "192.168.1.100-192.168.1.200"
            - name: DIB_DNS_FORWARDERS # Upstream DNS servers; adjust as needed.
              value: "1.1.1.1; 8.8.8.8;"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: kerberos-tcp
              containerPort: 88
              protocol: TCP
            - name: kerberos-udp
              containerPort: 88
              protocol: UDP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: ldaps
              containerPort: 636
              protocol: TCP
            - name: smb
              containerPort: 445
              protocol: TCP
          # Optional starting point for a small lab cluster. Adjust or remove to
          # match your node capacity and expected client load.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            tcpSocket:
              port: 389
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 389
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: bind-config # Mount for BIND configuration files.
              mountPath: /etc/bind
            - name: bind-data # Mount for BIND data files.
              mountPath: /var/bind
            - name: kea-config # Mount for Kea DHCP configuration files.
              mountPath: /etc/kea
            - name: kea-data # Mount for Kea DHCP persistent data.
              mountPath: /var/lib/kea
            - name: samba-config # Mount for Samba configuration files.
              mountPath: /etc/samba
            - name: samba-data # Mount for Samba persistent data.
              mountPath: /var/lib/samba
            - name: log-data # Mount for log data.
              mountPath: /var/log
  volumeClaimTemplates:
    - metadata:
        name: bind-config # PVC for bind-config; adjust storage size if needed.
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: your-rwo-storageclass
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: bind-data # PVC for bind-data.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: kea-config # PVC for kea-config.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: kea-data # PVC for kea-data.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: samba-config # PVC for samba-config.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: samba-data # PVC for samba-data.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: log-data # PVC for log-data.
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
