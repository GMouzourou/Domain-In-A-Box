services:
  domain-controller:
    image: gmouzourou/domain-in-a-box:latest
    hostname: domain-server
    container_name: domain-in-a-box
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      domain_net:
        # Set the static IP address for the domain controller – ensure it fits your network plan
        ipv4_address: "192.168.1.1"
    environment:
      # DIB_REALM: Specify your Kerberos/AD realm
      DIB_REALM: "${DIB_REALM:-HOME.ARPA}"
      # DIB_DOMAIN: Specify your short domain name
      DIB_DOMAIN: "${DIB_DOMAIN:-HOME}"
      # Set the domain administrator password used during provisioning
      DIB_DOMAIN_ADMIN_PASSWORD: "${DIB_DOMAIN_ADMIN_PASSWORD:-ChangeMeNow123!}"
      # Opt in if you want the env value to override manual AD password changes on restart
      DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART: "${DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART:-false}"
      # DIB_INTERFACE: Set the network interface to be used by the domain controller
      DIB_INTERFACE: "${DIB_INTERFACE:-eth0}"
      # DIB_DHCP_POOL: Define the DHCP range to lease addresses from; updates are applied on restart
      DIB_DHCP_POOL: "${DIB_DHCP_POOL:-192.168.1.100-192.168.1.199}"
      # DIB_DNS_FORWARDERS: Set your upstream DNS servers; updates are applied on restart
      DIB_DNS_FORWARDERS: "${DIB_DNS_FORWARDERS:-1.1.1.1; 8.8.8.8;}"
    volumes:
      # These volumes persist configuration and data; adjust if you want to bind mount host directories
      - bind-config:/etc/bind
      - bind-data:/var/cache/bind
      - chrony-config:/etc/chrony
      - chrony-data:/var/lib/chrony
      - kea-config:/etc/kea
      - kea-data:/var/lib/kea
      - samba-data:/var/lib/samba
      - log-data:/var/log

networks:
  domain_net:
    driver: macvlan
    driver_opts:
      parent: ${DIB_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: "192.168.1.0/24" # Adjust to match your local network subnet
          gateway: "192.168.1.254" # Set this to your network's gateway

volumes:
  bind-config:
  bind-data:
  chrony-config:
  chrony-data:
  kea-config:
  kea-data:
  samba-data:
  log-data:
