services:
  # 1. Main Core Container (Samba AD DC, BIND9, Kea DHCP & Chrony NTP)
  domain-controller:
    build:
      context: .
      dockerfile: Dockerfile
      target: core
    image: ghcr.io/gmouzourou/domain-in-a-box:latest
    hostname: domain-server
    container_name: domain-in-a-box
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      domain_net:
        # Set the static IP address for the domain controller – ensure it fits your network plan
        ipv4_address: "192.168.1.1"
    environment:
      # DIB_REALM: Specify your Kerberos/AD realm
      DIB_REALM: "${DIB_REALM:-DOMAIN.HOME.ARPA}"
      # DIB_DOMAIN: Specify your short domain name
      DIB_DOMAIN: "${DIB_DOMAIN:-DOMAIN}"
      # DIB_DOMAIN_ADMIN_PASSWORD: Set the domain administrator password used during provisioning
      DIB_DOMAIN_ADMIN_PASSWORD: "${DIB_DOMAIN_ADMIN_PASSWORD:-ChangeMeNow123!}"
      # DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART: Set true if you want the env value to override manual AD password changes on restart
      DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART: "${DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART:-false}"
      # Shared with Stork Server for LDAP authentication
      DIB_LDAP_PASSWORD: "${DIB_LDAP_PASSWORD:-ChangeMeLDAP123!}"
      # DIB_INTERFACE: Set the network interface to be used by the domain controller
      DIB_INTERFACE: "${DIB_INTERFACE:-eth0}"
      # DIB_DHCP_POOL: Define the DHCP range to lease addresses from; updates are applied on restart
      DIB_DHCP_POOL: "${DIB_DHCP_POOL:-192.168.1.100-192.168.1.199}"
      # DIB_DNS_FORWARDERS: Set your upstream DNS servers; updates are applied on restart
      DIB_DNS_FORWARDERS: "${DIB_DNS_FORWARDERS:-1.1.1.1; 8.8.8.8;}"
      # DIB_SAMBA_METRICS_ENABLED: Enable Samba metrics
      DIB_SAMBA_METRICS_ENABLED: "${DIB_SAMBA_METRICS_ENABLED:-true}"
      # DIB_SAMBA_METRICS_PORT: Samba metrics port
      DIB_SAMBA_METRICS_PORT: "${DIB_SAMBA_METRICS_PORT:-9922}"
      # Configure Stork to connect to the separate PostgreSQL service
      DIB_EMBEDDED_POSTGRES: "false"
      STORK_DATABASE_HOST: "${STORK_DATABASE_HOST:-192.168.1.2}"
      STORK_DATABASE_PORT: "${STORK_DATABASE_PORT:-5432}"
      STORK_DATABASE_NAME: "${STORK_DATABASE_NAME:-stork}"
      STORK_DATABASE_USER_NAME: "${STORK_DATABASE_USER_NAME:-stork}"
      STORK_DATABASE_PASSWORD: "${STORK_DATABASE_PASSWORD:-storkpass123!}"
      STORK_SERVER_HOST: "${STORK_SERVER_HOST:-192.168.1.3}"
      STORK_SERVER_PORT: "${STORK_SERVER_PORT:-80}"
    volumes:
      # These volumes persist configuration and data; adjust if you want to bind mount host directories
      - bind-config:/etc/bind
      - bind-data:/var/cache/bind
      - chrony-config:/etc/chrony
      - chrony-data:/var/lib/chrony
      - kea-config:/etc/kea
      - kea-data:/var/lib/kea
      - stork-config:/etc/stork
      - stork-data:/var/lib/stork-agent
      - samba-data:/var/lib/samba
      - log-data:/var/log
  # 2. Separate PostgreSQL Service (Used when user hasn't brought their own external Postgres)
  postgres:
    image: postgres:18-alpine
    container_name: dib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stork
      POSTGRES_USER: stork
      POSTGRES_PASSWORD: "${STORK_DATABASE_PASSWORD:-storkpass123!}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      domain_net:
        ipv4_address: "192.168.1.2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stork -d stork"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Separate Stork Server Container (REST API & Web UI)
  stork-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: stork
    image: ghcr.io/gmouzourou/domain-in-a-box-stork:latest
    container_name: dib-stork-server
    restart: unless-stopped
    command: ["run"]
    environment:
      DIB_OBSERVABILITY_COMPONENT: "stork-server"
      STORK_REST_HOST: "0.0.0.0"
      STORK_LDAP_DOMAIN: "${DIB_REALM:-DOMAIN.HOME.ARPA}"
      STORK_LDAP_HOST: "${STORK_LDAP_HOST:-domain-server}"
      STORK_LDAP_URL: "${STORK_LDAP_URL:-ldaps://192.168.1.1:636}"
      STORK_LDAP_PASSWORD: "${DIB_LDAP_PASSWORD:-ChangeMeLDAP123!}"
      STORK_DATABASE_HOST: "${STORK_DATABASE_HOST:-postgres}"
      STORK_DATABASE_PORT: "${STORK_DATABASE_PORT:-5432}"
      STORK_DATABASE_NAME: "${STORK_DATABASE_NAME:-stork}"
      STORK_DATABASE_USER_NAME: "${STORK_DATABASE_USER_NAME:-stork}"
      STORK_DATABASE_PASSWORD: "${STORK_DATABASE_PASSWORD:-storkpass123!}"
    ports:
      - "8080:80"
    networks:
      domain_net:
        ipv4_address: "192.168.1.3"

networks:
  domain_net:
    driver: macvlan
    driver_opts:
      parent: ${DIB_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: "192.168.1.0/24" # Adjust to match your local network subnet
          gateway: "192.168.1.254" # Set this to your network's gateway

volumes:
  bind-config:
  bind-data:
  chrony-config:
  chrony-data:
  kea-config:
  kea-data:
  stork-config:
  stork-data:
  samba-data:
  log-data:
  postgres-data:
