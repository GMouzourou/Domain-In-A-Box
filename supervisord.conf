[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
childlogdir=/var/log

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:bind]
command=/usr/sbin/named -f -c /etc/bind/named.conf
user=bind
autorestart=true
priority=1

[program:chrony]
command=/usr/sbin/chronyd -n -x -f /etc/chrony/chrony.conf
user=root
autorestart=true
priority=2

[program:kea-dhcp4]
command=/usr/sbin/kea-dhcp4 -c /etc/kea/kea-dhcp4.conf
user=_kea
autorestart=true
priority=3

[program:kea-dhcp-ddns]
command=/usr/sbin/kea-dhcp-ddns -c /etc/kea/kea-dhcp-ddns.conf
user=_kea
autorestart=true
priority=4

[program:samba]
command=/usr/sbin/samba -i
user=root
autorestart=true
priority=5
