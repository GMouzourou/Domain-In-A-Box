version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directories:
      - /
      - /tests/test-runner
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - /
      - /tests/linux-client
    schedule:
      interval: weekly
