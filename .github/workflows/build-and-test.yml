name: CI / CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: domain-in-a-box-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: domain-in-a-box
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce Trivy severity policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache: false

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          cache: false

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments README.md docs/*.md
          lycheeVersion: v0.24.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/test-runner/go.mod
          cache-dependency-path: tests/test-runner/go.sum

      - name: Check Go module consistency and vulnerabilities
        run: make go-mod-check go-vulncheck

      - name: Lint Go code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Lint Go test runner
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: tests/test-runner

      - name: Check release version and deployment pins
        run: make version-check

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: make shellcheck

      - name: Lint Dockerfiles
        run: make hadolint

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Validate deployment manifests
        run: |
          make docker-lint
          make helm-lint

      - name: Test OCI artifact validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test Stork management connections
        run: python3 -m unittest discover -s tests/kubernetes -p 'test_stork_management.py'

  build:
    name: Build Go test runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/test-runner/go.mod
          cache-dependency-path: tests/test-runner/go.sum

      - name: Test, vet, and build
        run: |
          go test ./...
          go vet ./...
          go build ./...
          cd tests/test-runner
          go test ./...
          go vet ./...
          go build ./...

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create image directory
        run: |
          mkdir -p /tmp/images
          echo "RELEASE_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "REGISTRY=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Extract core metadata before building
        id: core-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Extract Stork metadata before building
        id: stork-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-stork

      - name: Extract bridge metadata before building
        id: bridge-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-external-dns-bridge

      - name: Build the shared image graph once
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          TAG: ci
          OUTPUT_DIR: /tmp/images
          GHA_CACHE: 'true'
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
          CORE_METADATA: ${{ steps.core-meta.outputs.json }}
          STORK_METADATA: ${{ steps.stork-meta.outputs.json }}
          BRIDGE_METADATA: ${{ steps.bridge-meta.outputs.json }}
        with:
          files: ./docker-bake.hcl
          targets: default
          allow: fs.write=/tmp/images

      - name: Verify content identity and attestation binding
        run: |
          for image in /tmp/images/*.oci.tar; do
            python3 .github/scripts/oci_archive.py verify "$image"
          done

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-images
          path: /tmp/images
          retention-days: 1
          compression-level: 0

  image-security:
    name: Scan ${{ matrix.image }} OCI image
    runs-on: ubuntu-latest
    needs: images
    strategy:
      fail-fast: false
      matrix:
        image: [core, stork, external-dns-bridge, test-client]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable native OCI image storage
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Download built OCI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: /tmp/images
      - name: Verify and load the exact OCI artifact
        run: python3 .github/scripts/oci_archive.py load /tmp/images/${{ matrix.image }}.oci.tar --tag dib-${{ matrix.image }}:scan
      - name: Enforce runtime image severity policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: dib-${{ matrix.image }}:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache: false

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 20
    env:
      DIB_TEST_MACVLAN_PARENT: dib-ci-parent

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable native OCI image storage
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: /tmp/images

      - name: Load images
        run: |
          python3 .github/scripts/oci_archive.py load /tmp/images/core.oci.tar --tag domain-in-a-box:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/stork.oci.tar --tag domain-in-a-box-stork:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/test-client.oci.tar --tag domain-in-a-box-test-client:ci

      - name: Create isolated macvlan parent
        id: macvlan-parent
        run: |
          sudo ip link add "$DIB_TEST_MACVLAN_PARENT" type dummy
          if ! sudo ip link set "$DIB_TEST_MACVLAN_PARENT" up; then
            sudo ip link delete "$DIB_TEST_MACVLAN_PARENT"
            exit 1
          fi

      - name: Run full test suite
        run: make test-prebuilt

      - name: Capture compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f tests/docker-compose.test.yml logs --no-color > artifacts/docker-compose.log || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Cleanup test environment
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v || true

      - name: Remove isolated macvlan parent
        if: always() && steps.macvlan-parent.outcome == 'success'
        run: sudo ip link delete "$DIB_TEST_MACVLAN_PARENT"

  kubernetes:
    name: Kubernetes integration tests
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable native OCI image storage
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: /tmp/images

      - name: Load images
        run: |
          python3 .github/scripts/oci_archive.py load /tmp/images/core.oci.tar --tag domain-in-a-box:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/stork.oci.tar --tag domain-in-a-box-stork:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/test-client.oci.tar --tag domain-in-a-box-test-client:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/external-dns-bridge.oci.tar --tag domain-in-a-box-external-dns-bridge:ci

      - name: Provision kind cluster with Multus
        run: make k8s-up

      - name: Load images into the cluster
        run: make k8s-load

      - name: Deploy Helm chart
        run: make k8s-deploy

      - name: Run test suite in cluster
        run: make k8s-test

      - name: Collect cluster diagnostics
        if: always()
        run: make k8s-logs

      - name: Upload cluster diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-logs
          path: artifacts/k8s
          if-no-files-found: ignore

      - name: Tear down cluster
        if: always()
        run: make k8s-down || true

  bridge:
    name: ExternalDNS bridge acceptance
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2
      - name: Enable native OCI image storage
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: /tmp/images

      - name: Load exact bridge and controller artifacts
        run: |
          python3 .github/scripts/oci_archive.py load /tmp/images/core.oci.tar --tag domain-in-a-box:ci
          python3 .github/scripts/oci_archive.py load /tmp/images/external-dns-bridge.oci.tar --tag domain-in-a-box-external-dns-bridge:ci

      - name: Install the pinned kind test dependency
        run: |
          mkdir -p /tmp/dib-tools
          curl -fsSLo /tmp/dib-tools/kind-linux-amd64 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -fsSLo /tmp/dib-tools/kind.sha256sum https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          cd /tmp/dib-tools
          sha256sum --check kind.sha256sum
          chmod +x kind-linux-amd64

      - name: Run disposable two-controller and official ExternalDNS acceptance
        run: |
          CGO_ENABLED=0 go test -c ./internal/services/dnsbridge -o /tmp/dib-backend-test
          python3 tests/dnsbridge/integration.py \
            --core-image domain-in-a-box:ci \
            --bridge-image domain-in-a-box-external-dns-bridge:ci \
            --backend-test-binary /tmp/dib-backend-test \
            --kind /tmp/dib-tools/kind-linux-amd64 \
            --work-dir /tmp/dib-bridge-acceptance \
            --name dib-bridge-ci

      - name: Upload bridge diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-logs
          path: /tmp/dib-bridge-acceptance/*.log
          if-no-files-found: ignore

  publish:
    name: Publish container images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [lint, integration, kubernetes, bridge, image-security]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the tested OCI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: /tmp/images

      - name: Prepare image names
        id: prep
        run: |
          if { [ -n "${DOCKERHUB_USERNAME}" ] && [ -z "${DOCKERHUB_PASSWORD}" ]; } ||
             { [ -z "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_PASSWORD}" ]; }; then
            echo "Docker Hub publication requires both DOCKER_USERNAME and DOCKER_PASSWORD" >&2
            exit 1
          fi
          images="ghcr.io/${{ github.repository }}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"
          fi
          {
            echo 'images<<EOF'
            echo "$images"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Extract image metadata
        id: core-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract Stork image metadata
        id: stork-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-stork
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract bridge image tags
        id: bridge-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-external-dns-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote exact tested artifacts without rebuilding
        env:
          CORE_TAGS: ${{ steps.core-meta.outputs.tags }}
          STORK_TAGS: ${{ steps.stork-meta.outputs.tags }}
          BRIDGE_TAGS: ${{ steps.bridge-meta.outputs.tags }}
        run: |
          python3 .github/scripts/oci_archive.py promote /tmp/images/core.oci.tar --tags-env CORE_TAGS
          python3 .github/scripts/oci_archive.py promote /tmp/images/stork.oci.tar --tags-env STORK_TAGS
          python3 .github/scripts/oci_archive.py promote /tmp/images/external-dns-bridge.oci.tar --tags-env BRIDGE_TAGS
