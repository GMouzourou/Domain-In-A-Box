name: CI / CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: domain-in-a-box-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: domain-in-a-box
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Security scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          cache: false
        continue-on-error: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/test-runner/go.mod
          cache-dependency-path: tests/test-runner/go.sum

      - name: Check Go formatting
        run: |
          UNFORMATTED=$(cd tests/test-runner && gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -x entrypoint.sh entrypoint.d/*.sh tests/linux-client/entrypoint.sh

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3015 --ignore DL3018 - < Dockerfile
          docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3015 - < tests/linux-client/Dockerfile

      - name: Validate deployment manifests
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f tests/docker-compose.test.yml config >/dev/null

  build:
    name: Build Go test runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/test-runner/go.mod
          cache-dependency-path: tests/test-runner/go.sum

      - name: Test, vet, and build
        run: |
          cd tests/test-runner
          go test ./...
          go vet ./...
          go build ./...

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run full test suite
        run: make test-all

      - name: Capture compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f tests/docker-compose.test.yml logs --no-color > artifacts/docker-compose.log || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Cleanup test environment
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v || true

  publish:
    name: Publish container image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [integration]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image names
        id: prep
        run: |
          images="ghcr.io/${{ github.repository }}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"
          fi
          {
            echo 'images<<EOF'
            echo "$images"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
