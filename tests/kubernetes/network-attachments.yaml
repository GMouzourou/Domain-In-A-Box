# CI-only network attachments, deliberately kept outside the chart.
# __MASTER__ is substituted with the kind node interface facing the lab bridge.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: dib-macvlan-server
# The 192.168.3.254/32 route exists only so entrypoint.sh can detect a gateway.
# The pod default route must stay on eth0, or ClusterIP traffic would bypass
# kube-proxy on the node.
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "dib-macvlan-server",
      "type": "macvlan",
      "master": "__MASTER__",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "192.168.3.1/24" }
        ],
        "routes": [
          { "dst": "192.168.3.254/32", "gw": "192.168.3.254" }
        ]
      }
    }
---
# The Stork server needs to reach the agent on its macvlan address.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: dib-macvlan-stork
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "dib-macvlan-stork",
      "type": "macvlan",
      "master": "__MASTER__",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "192.168.3.4/24" }
        ]
      }
    }
---
# No IPAM: the client must obtain its address from Kea over the shared segment,
# which is the actual DHCP assertion.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: dib-macvlan-client
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "dib-macvlan-client",
      "type": "macvlan",
      "master": "__MASTER__",
      "mode": "bridge",
      "ipam": {}
    }
