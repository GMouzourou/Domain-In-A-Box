services:
  # Domain Controller
  domain-controller:
    build:
      context: ..
      dockerfile: Dockerfile
      target: core
    image: domain-in-a-box:ci
    hostname: domain-controller
    container_name: domain-in-a-box-test-server
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      domain_net:
        ipv4_address: 192.168.2.1
    ports:
      # DNS (using different ports to avoid host conflicts)
      - "5353:53"
      - "5353:53/udp"
      # DHCP
      - "6767:67/udp"
      - "6868:68/udp"
      # Kerberos
      - "8888:88"
      - "8888:88/udp"
      # LDAP
      - "3389:389"
      - "3636:636"
      # RPC
      - "1135:135"
      # SMB
      - "1137:137"
      - "1138:138"
      - "1139:139"
      - "1445:445"
      - "1464:464"
      - "13268:3268"
      - "13269:3269"
    environment:
      DIB_REALM: "DOMAIN.HOME.ARPA"
      DIB_DOMAIN: "DOMAIN"
      DIB_DOMAIN_ADMIN_PASSWORD: "P@ssw0rd"
      DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART: "false"
      DIB_INTERFACE: "eth0"
      DIB_DHCP_POOL: "192.168.2.100-192.168.2.199"
      DIB_DNS_FORWARDERS: "1.1.1.1; 8.8.8.8;"
      DIB_SAMBA_METRICS_ENABLED: "true"
      DIB_SAMBA_METRICS_PORT: "9922"
      DIB_LDAP_PASSWORD: "StorkLDAPTestPassword123!"
      DIB_EMBEDDED_POSTGRES: "false"
      STORK_DATABASE_HOST: "192.168.2.3"
      STORK_DATABASE_PORT: "5432"
      STORK_DATABASE_NAME: "stork"
      STORK_DATABASE_USER_NAME: "stork"
      STORK_DATABASE_PASSWORD: "StorkPostgresTestPassword123!"
      STORK_SERVER_HOST: "192.168.2.4"
      STORK_SERVER_PORT: "80"
    volumes:
      - bind-config:/etc/bind
      - bind-data:/var/cache/bind
      - chrony-config:/etc/chrony
      - chrony-data:/var/lib/chrony
      - kea-config:/etc/kea
      - kea-data:/var/lib/kea
      - stork-config:/etc/stork
      - stork-data:/var/lib/stork-agent
      - samba-data:/var/lib/samba
      - log-data:/var/log
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket, sys; ports = (389, 9119, 9547); sys.exit(any(socket.socket().connect_ex(('127.0.0.1', port)) for port in ports))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      stork-server:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    container_name: domain-in-a-box-test-postgres
    environment:
      POSTGRES_DB: "stork"
      POSTGRES_USER: "stork"
      POSTGRES_PASSWORD: "StorkPostgresTestPassword123!"
    networks:
      domain_net:
        ipv4_address: 192.168.2.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stork -d stork"]
      interval: 5s
      timeout: 5s
      retries: 5

  stork-server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: stork
    image: domain-in-a-box-stork:ci
    container_name: domain-in-a-box-test-stork-server
    command: ["run"]
    environment:
      DIB_OBSERVABILITY_COMPONENT: "stork-server"
      STORK_REST_HOST: "0.0.0.0"
      STORK_LDAP_URL: "ldaps://192.168.2.1:636"
      STORK_LDAP_DOMAIN: "domain.home.arpa"
      STORK_LDAP_HOST: "domain-controller"
      STORK_LDAP_PASSWORD: "StorkLDAPTestPassword123!"
      STORK_DATABASE_HOST: "postgres"
      STORK_DATABASE_PORT: "5432"
      STORK_DATABASE_NAME: "stork"
      STORK_DATABASE_USER_NAME: "stork"
      STORK_DATABASE_PASSWORD: "StorkPostgresTestPassword123!"
    networks:
      domain_net:
        ipv4_address: 192.168.2.4
    depends_on:
      postgres:
        condition: service_healthy

  # Test Suite Runner
  test-runner:
    build:
      context: ..
      dockerfile: tests/linux-client/Dockerfile
    image: domain-in-a-box-test-client:ci
    hostname: domain-client
    container_name: domain-in-a-box-test-client
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - domain_net
    environment:
      DOMAIN_CONTROLLER_IP: "192.168.2.1"
      STORK_SERVER_IP: "192.168.2.4"
      DIB_DOMAIN: "DOMAIN"
      DIB_REALM: "DOMAIN.HOME.ARPA"
      DOMAIN_FQDN: "domain.home.arpa"
      ADMIN_USER: "Administrator"
      ADMIN_PASSWORD: "P@ssw0rd"
      SERVER_HOSTNAME: "domain-controller"
      DNS_DOMAIN: "domain.home.arpa"
      ENABLE_DHCP_CLIENT: "false"
      DIB_DHCP_POOL: "192.168.2.100-192.168.2.199"
      SUBNET: "192.168.2.0/24"
      GATEWAY: "192.168.2.254"
    depends_on:
      domain-controller:
        condition: service_healthy
    command: ["/usr/local/bin/test-runner","run","all"]
    tty: true
    stdin_open: true
    
networks:
  domain_net:
    driver: macvlan
    driver_opts:
      parent: "eth0"
    ipam:
      config:
        - subnet: "192.168.2.0/24"
          gateway: "192.168.2.254"

volumes:
  bind-config:
  bind-data:
  chrony-config:
  chrony-data:
  kea-config:
  kea-data:
  stork-config:
  stork-data:
  samba-data:
  log-data:
