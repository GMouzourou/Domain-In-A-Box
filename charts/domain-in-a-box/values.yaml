# Default values for domain-in-a-box.

coreImage:
  repository: ghcr.io/gmouzourou/domain-in-a-box
  pullPolicy: IfNotPresent
  tag: "0.4.0"

storkImage:
  repository: ghcr.io/gmouzourou/domain-in-a-box-stork
  pullPolicy: IfNotPresent
  tag: "0.4.0"

domain:
  realm: "DOMAIN.HOME.ARPA"
  name: "DOMAIN"
  interface: "net1"
  dhcpPool: "192.168.1.100-192.168.1.199"
  dnsForwarders: "1.1.1.1; 8.8.8.8;"
  syncPasswordOnRestart: false

credentials:
  # Create this Kubernetes Secret before installing the chart.
  secretName: "domain-in-a-box-credentials"
  adminPasswordKey: "domain-admin-password"
  databasePasswordKey: "stork-db-password"
  ldapPasswordKey: "stork-ldap-password"

metrics:
  enabled: true
  port: 9922

storkServer:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# Domain of the in-cluster DNS. The controller points its resolver at BIND,
# which must forward this zone for in-cluster services. Empty uses cluster.local.
clusterDNS:
  domain: "cluster.local"

multus:
  enabled: true
  createNAD: true
  networkName: "macvlan-network"
  # Optional LAN attachment for deployments that need the Stork server on an
  # external network. The default agent callback uses an internal Service.
  storkServerNetworkName: ""
  masterInterface: "eth0"
  address: "192.168.1.1/24"
  gateway: "192.168.1.254"

tls:
  controller:
    # Existing Secret containing the controller certificate, key, and CA.
    secretName: "domain-in-a-box-controller-tls"
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
    caKey: "ca.crt"
  storkServer:
    enabled: true
    # Existing Secret containing the Stork REST server certificate and key.
    secretName: "domain-in-a-box-stork-server-tls"
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
    # CA trusted by the controller when it connects to the Stork REST service.
    caSecretName: ""
    caKey: "ca.crt"
    # Disabling HTTPS requires explicitly allowing insecure registration.
    allowInsecureHttp: false
  ldap:
    # Defaults to tls.controller.secretName when omitted.
    caSecretName: ""
    caKey: "ca.crt"
    # Defaults to the controller's in-cluster Service name.
    serverName: ""
    skipServerVerification: false
    # Skipping LDAP certificate verification requires explicit opt-in.
    allowInsecureSkipServerVerification: false

database:
  # Set external.enabled to true to connect Stork to an external PostgreSQL cluster (e.g. in RKE2)
  external:
    enabled: false
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    name: "stork"
    user: "stork"
    passwordSecret:
      name: ""
      key: "password"
    tls:
      # For certificate verification use verify-ca or, preferably, verify-full.
      sslMode: "verify-full"
      # disable and require need explicit opt-in because they do not verify the peer.
      allowInsecure: false
      rootCertSecretName: ""
      rootCertKey: "ca.crt"
      clientCertSecretName: ""
      clientCertKey: "tls.crt"
      clientKeyKey: "tls.key"
  internal:
    image: "postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95"
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

nodeSelector: {}
tolerations: []
affinity: {}
