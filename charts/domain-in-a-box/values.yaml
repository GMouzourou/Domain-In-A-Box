# Default values for domain-in-a-box.

coreImage:
  repository: ghcr.io/gmouzourou/domain-in-a-box
  pullPolicy: IfNotPresent
  tag: "0.6.0"

storkImage:
  repository: ghcr.io/gmouzourou/domain-in-a-box-stork
  pullPolicy: IfNotPresent
  tag: "0.6.0"

security:
  # Compatibility escape hatch only; normal controllers use explicit capabilities.
  privileged: false

networkPolicy:
  # Applies to the primary pod network, not Multus/macvlan LAN attachments.
  enabled: false
  # Additional Kubernetes NetworkPolicy rules for clients, metrics and external dependencies.
  ingress: []
  egress: []

domain:
  realm: "DOMAIN.HOME.ARPA"
  # NetBIOS domain name. Empty uses the realm's first label, for example DOMAIN.
  name: ""
  # primary provisions the domain; secondary joins the controller at peer.address.
  controllerMode: primary
  # Override for the controller a secondary joins. Empty uses peer.address.
  joinServer: ""
  interface: "net1"
  # Serve DHCP from this controller. Unset defaults to true for a primary and
  # false for a secondary; a DHCP HA standby runs DHCP through dhcpHA instead.
  # dhcpEnabled: true
  dhcpPool: "192.168.1.100-192.168.1.199"
  # Comma-separated IPv4 resolvers advertised to DHCP clients. Empty advertises
  # this controller, followed by its partner when dhcpHA is enabled.
  dhcpDNSServers: ""
  dnsForwarders: "1.1.1.1; 8.8.8.8;"
  # Reverse DNS zone. Empty derives it from the LAN prefix (/8, /16, or /24 and
  # longer); set it for other prefixes, for example "168.192.in-addr.arpa".
  reverseZone: ""
  syncPasswordOnRestart: false

# The other controller of a primary/secondary pair. Set on both controllers.
peer:
  # LAN IPv4 address of the other controller.
  address: ""
  # Resource name (fullnameOverride) of the primary. Required on a secondary to
  # find the primary's Stork server Service and its TLS Secret.
  name: ""

dhcpHA:
  # Enable only when configuring the fixed primary/standby pair.
  enabled: false
  # Overrides. Empty uses this controller's multus.address and peer.address.
  primaryAddress: ""
  standbyAddress: ""
  primaryName: "dib-primary"
  standbyName: "dib-secondary"

sysvolSync:
  # Enable only when configuring the fixed writer/standby pair.
  enabled: false
  # Secret contents depend on controllerMode:
  # primary: ssh_host_ed25519_key and id_ed25519.pub
  # secondary: id_ed25519 and known_hosts
  secretName: ""
  hostKeyKey: "ssh_host_ed25519_key"
  clientPrivateKeyKey: "id_ed25519"
  clientPublicKeyKey: "id_ed25519.pub"
  knownHostsKey: "known_hosts"
  # Overrides. Empty uses peer.address.
  peerAddress: ""
  writerAddress: ""
  sshPort: 22
  intervalSeconds: 60

credentials:
  # Create this Kubernetes Secret before installing the chart.
  secretName: "domain-in-a-box-credentials"
  adminPasswordKey: "domain-admin-password"
  databasePasswordKey: "stork-db-password"
  ldapPasswordKey: "stork-ldap-password"

metrics:
  enabled: true
  port: 9922

storkServer:
  # Run the Stork server and its database with this release. Unset defaults to
  # true for a primary and false for a secondary, which uses the primary's.
  # enabled: true
  # Override for the Stork server address. Empty derives it from the release
  # that runs Stork (peer.name on a secondary).
  host: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# Domain of the in-cluster DNS. The controller points its resolver at BIND,
# which must forward this zone for in-cluster services. Empty uses cluster.local.
clusterDNS:
  domain: "cluster.local"

multus:
  enabled: true
  createNAD: true
  # NetworkAttachmentDefinition name. Empty uses <fullname>-macvlan.
  networkName: ""
  # Optional LAN attachment for deployments that need the Stork server on an
  # external network. The default agent callback uses an internal Service.
  storkServerNetworkName: ""
  masterInterface: "eth0"
  address: "192.168.1.1/24"
  gateway: "192.168.1.254"

tls:
  controller:
    # Existing Secret containing the controller certificate, key, and CA.
    # Unset uses <fullname>-controller-tls; an empty string disables it.
    # secretName: ""
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
    caKey: "ca.crt"
  storkServer:
    enabled: true
    # Existing Secret containing the Stork REST server certificate and key.
    # Empty uses <stork owner>-stork-server-tls, where the owner is this
    # release for a primary and peer.name for a secondary.
    secretName: ""
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
    # CA trusted by the controller when it connects to the Stork REST service.
    caSecretName: ""
    caKey: "ca.crt"
    # Disabling HTTPS requires explicitly allowing insecure registration.
    allowInsecureHttp: false
  ldap:
    # Defaults to tls.controller.secretName when omitted.
    caSecretName: ""
    caKey: "ca.crt"
    # Defaults to the controller's in-cluster Service name.
    serverName: ""
    skipServerVerification: false
    # Skipping LDAP certificate verification requires explicit opt-in.
    allowInsecureSkipServerVerification: false

database:
  # Set external.enabled to true to connect Stork to an external PostgreSQL cluster (e.g. in RKE2)
  external:
    enabled: false
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    name: "stork"
    user: "stork"
    passwordSecret:
      name: ""
      key: "password"
    tls:
      # For certificate verification use verify-ca or, preferably, verify-full.
      sslMode: "verify-full"
      # disable and require need explicit opt-in because they do not verify the peer.
      allowInsecure: false
      rootCertSecretName: ""
      rootCertKey: "ca.crt"
      clientCertSecretName: ""
      clientCertKey: "tls.crt"
      clientKeyKey: "tls.key"
  internal:
    image: "postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95"
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

nodeSelector: {}
tolerations: []
affinity: {}
