apiVersion: v1
kind: Service
metadata:
  name: {{ include "domain-in-a-box.fullname" . }}-svc
  labels:
    {{- include "domain-in-a-box.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "domain-in-a-box.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: domain-controller
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dhcp-server
      port: 67
      targetPort: 67
      protocol: UDP
    - name: dhcp-client
      port: 68
      targetPort: 68
      protocol: UDP
    - name: stork-srv-http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: kerberos-tcp
      port: 88
      targetPort: 88
      protocol: TCP
    - name: kerberos-udp
      port: 88
      targetPort: 88
      protocol: UDP
    - name: ntp
      port: 123
      targetPort: 123
      protocol: UDP
    - name: rpc-epmap
      port: 135
      targetPort: 135
      protocol: TCP
    - name: netbios-ns
      port: 137
      targetPort: 137
      protocol: UDP
    - name: netbios-dgm
      port: 138
      targetPort: 138
      protocol: UDP
    - name: netbios-ssn
      port: 139
      targetPort: 139
      protocol: TCP
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: cldap
      port: 389
      targetPort: 389
      protocol: UDP
    - name: stork-srv-https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
    - name: kpasswd-tcp
      port: 464
      targetPort: 464
      protocol: TCP
    - name: kpasswd-udp
      port: 464
      targetPort: 464
      protocol: UDP
    - name: ldaps
      port: 636
      targetPort: 636
      protocol: TCP
    - name: gc-tcp
      port: 3268
      targetPort: 3268
      protocol: TCP
    - name: gc-ssl
      port: 3269
      targetPort: 3269
      protocol: TCP
    - name: alt-dns-tcp
      port: 5353
      targetPort: 5353
      protocol: TCP
    - name: alt-dns-udp
      port: 5353
      targetPort: 5353
      protocol: UDP
    - name: bind-metrics
      port: 9119
      targetPort: 9119
      protocol: TCP
    - name: kea-metrics
      port: 9547
      targetPort: 9547
      protocol: TCP
    - name: samba-metrics
      port: 9922
      targetPort: 9922
      protocol: TCP
