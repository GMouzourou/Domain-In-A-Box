{{- $ldapCASecret := default .Values.tls.controller.secretName .Values.tls.ldap.caSecretName -}}
{{- $clusterDomain := default "cluster.local" .Values.clusterDNS.domain -}}
{{- $storkServerHost := printf "%s-stork-server.%s.svc.%s" (include "domain-in-a-box.fullname" .) .Release.Namespace $clusterDomain -}}
{{- if and .Values.tls.storkServer.enabled (not .Values.tls.storkServer.secretName) -}}
{{- fail "tls.storkServer.secretName is required when tls.storkServer.enabled is true" -}}
{{- end -}}
{{- if and (not .Values.tls.storkServer.enabled) (not .Values.tls.storkServer.allowInsecureHttp) -}}
{{- fail "tls.storkServer.allowInsecureHttp must be true when Stork REST TLS is disabled" -}}
{{- end -}}
{{- if and .Values.tls.ldap.skipServerVerification (not .Values.tls.ldap.allowInsecureSkipServerVerification) -}}
{{- fail "tls.ldap.allowInsecureSkipServerVerification must be true when LDAP certificate verification is disabled" -}}
{{- end -}}
{{- if and (not .Values.tls.ldap.skipServerVerification) (not $ldapCASecret) -}}
{{- fail "an LDAP CA Secret is required when LDAP certificate verification is enabled" -}}
{{- end -}}
{{- if and .Values.database.external.enabled (not (has .Values.database.external.tls.sslMode (list "disable" "require" "verify-ca" "verify-full"))) -}}
{{- fail "database.external.tls.sslMode must be disable, require, verify-ca, or verify-full" -}}
{{- end -}}
{{- if and .Values.database.external.enabled (has .Values.database.external.tls.sslMode (list "disable" "require")) (not .Values.database.external.tls.allowInsecure) -}}
{{- fail "database.external.tls.allowInsecure must be true when sslMode is disable or require" -}}
{{- end -}}
{{- if and .Values.database.external.enabled (has .Values.database.external.tls.sslMode (list "verify-ca" "verify-full")) (not .Values.database.external.tls.rootCertSecretName) -}}
{{- fail "database.external.tls.rootCertSecretName is required for verify-ca or verify-full" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "domain-in-a-box.fullname" . }}
  labels:
    {{- include "domain-in-a-box.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "domain-in-a-box.fullname" . }}-svc
  replicas: 1
  selector:
    matchLabels:
      {{- include "domain-in-a-box.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "domain-in-a-box.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: domain-controller
      {{- if .Values.multus.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{ "name": "{{ .Values.multus.networkName }}" }]'
      {{- end }}
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: domain-server
          image: "{{ .Values.coreImage.repository }}:{{ .Values.coreImage.tag }}"
          imagePullPolicy: {{ .Values.coreImage.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          env:
            - name: DIB_REALM
              value: {{ .Values.domain.realm | quote }}
            - name: DIB_DOMAIN
              value: {{ .Values.domain.name | quote }}
            - name: DIB_DOMAIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName | quote }}
                  key: {{ .Values.credentials.adminPasswordKey | quote }}
            - name: DIB_SYNC_DOMAIN_ADMIN_PASSWORD_ON_RESTART
              value: {{ .Values.domain.syncPasswordOnRestart | quote }}
            - name: DIB_INTERFACE
              value: {{ .Values.domain.interface | quote }}
            - name: DIB_DHCP_POOL
              value: {{ .Values.domain.dhcpPool | quote }}
            - name: DIB_DNS_FORWARDERS
              value: {{ .Values.domain.dnsForwarders | quote }}
            - name: DIB_CLUSTER_DOMAIN
              value: {{ $clusterDomain | quote }}
            - name: DIB_SAMBA_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: DIB_SAMBA_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: DIB_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName | quote }}
                  key: {{ .Values.credentials.ldapPasswordKey | quote }}
            - name: STORK_DATABASE_HOST
              value: {{ .Values.database.external.enabled | ternary .Values.database.external.host (printf "%s-postgresql" (include "domain-in-a-box.fullname" .)) | quote }}
            - name: STORK_DATABASE_PORT
              value: {{ .Values.database.external.enabled | ternary .Values.database.external.port 5432 | quote }}
            - name: STORK_DATABASE_NAME
              value: {{ .Values.database.external.enabled | ternary .Values.database.external.name "stork" | quote }}
            - name: STORK_DATABASE_USER_NAME
              value: {{ .Values.database.external.enabled | ternary .Values.database.external.user "stork" | quote }}
            - name: STORK_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{ if .Values.database.external.enabled }}
                  name: {{ required "database.external.passwordSecret.name is required when external PostgreSQL is enabled" .Values.database.external.passwordSecret.name | quote }}
                  key: {{ .Values.database.external.passwordSecret.key | quote }}
                  {{ else }}
                  name: {{ .Values.credentials.secretName | quote }}
                  key: {{ .Values.credentials.databasePasswordKey | quote }}
                  {{ end }}
            - name: STORK_SERVER_HOST
              value: {{ $storkServerHost | quote }}
            - name: STORK_SERVER_PORT
              value: {{ ternary "443" "80" .Values.tls.storkServer.enabled | quote }}
            - name: STORK_SERVER_SCHEME
              value: {{ ternary "https" "http" .Values.tls.storkServer.enabled | quote }}
            - name: DIB_ALLOW_INSECURE_STORK_HTTP
              value: {{ .Values.tls.storkServer.allowInsecureHttp | quote }}
            - name: DIB_STORK_AGENT_BIND_ADDRESS
              value: "0.0.0.0"
            - name: DIB_STORK_AGENT_ADVERTISE_HOST
              value: {{ printf "%s-stork-agent.%s.svc.%s" (include "domain-in-a-box.fullname" .) .Release.Namespace $clusterDomain | quote }}
            - name: DIB_STORK_RECONCILE_AGENT_ENV
              value: "true"
            {{- if .Values.tls.storkServer.enabled }}
            - name: DIB_STORK_SERVER_CA_CERTIFICATE
              value: "/etc/dib-trust/stork-server/ca.crt"
            {{- end }}
            - name: DIB_STORK_RECONCILE_SERVER_ENV
              value: "true"
            - name: STORK_REST_PORT
              value: {{ ternary "443" "80" .Values.tls.storkServer.enabled | quote }}
            - name: DIB_STORK_REST_TLS_ENABLED
              value: {{ .Values.tls.storkServer.enabled | quote }}
            - name: STORK_LDAP_HOST
              value: {{ default (printf "%s-svc.%s.svc.%s" (include "domain-in-a-box.fullname" .) .Release.Namespace $clusterDomain) .Values.tls.ldap.serverName | quote }}
            - name: STORK_LDAP_URL
              value: {{ printf "ldaps://%s:636" (default (printf "%s-svc.%s.svc.%s" (include "domain-in-a-box.fullname" .) .Release.Namespace $clusterDomain) .Values.tls.ldap.serverName) | quote }}
            - name: STORK_SERVER_HOOK_LDAP_SKIP_SERVER_TLS_VERIFICATION
              value: {{ .Values.tls.ldap.skipServerVerification | quote }}
            - name: DIB_ALLOW_INSECURE_LDAP_TLS
              value: {{ .Values.tls.ldap.allowInsecureSkipServerVerification | quote }}
            - name: DIB_STORK_DATABASE_EXTERNAL
              value: {{ .Values.database.external.enabled | quote }}
            - name: DIB_ALLOW_INSECURE_POSTGRESQL
              value: {{ .Values.database.external.tls.allowInsecure | quote }}
            {{- if .Values.database.external.enabled }}
            - name: STORK_DATABASE_SSLMODE
              value: {{ .Values.database.external.tls.sslMode | quote }}
            - name: STORK_DATABASE_SSLROOTCERT
              value: {{ ternary "/etc/stork/postgresql-tls/ca.crt" "" (ne .Values.database.external.tls.rootCertSecretName "") | quote }}
            - name: STORK_DATABASE_SSLCERT
              value: {{ ternary (printf "/etc/stork/postgresql-tls/%s" .Values.database.external.tls.clientCertKey) "" (ne .Values.database.external.tls.clientCertSecretName "") | quote }}
            - name: STORK_DATABASE_SSLKEY
              value: {{ ternary (printf "/etc/stork/postgresql-tls/%s" .Values.database.external.tls.clientKeyKey) "" (ne .Values.database.external.tls.clientCertSecretName "") | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.external.tls.sslMode | quote }}
            - name: PGSSLROOTCERT
              value: {{ ternary "/etc/stork/postgresql-tls/ca.crt" "" (ne .Values.database.external.tls.rootCertSecretName "") | quote }}
            - name: PGSSLCERT
              value: {{ ternary (printf "/etc/stork/postgresql-tls/%s" .Values.database.external.tls.clientCertKey) "" (ne .Values.database.external.tls.clientCertSecretName "") | quote }}
            - name: PGSSLKEY
              value: {{ ternary (printf "/etc/stork/postgresql-tls/%s" .Values.database.external.tls.clientKeyKey) "" (ne .Values.database.external.tls.clientCertSecretName "") | quote }}
            {{- end }}
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp-server
              containerPort: 67
              protocol: UDP
            - name: dhcp-client
              containerPort: 68
              protocol: UDP
            - name: kerberos-tcp
              containerPort: 88
              protocol: TCP
            - name: kerberos-udp
              containerPort: 88
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP
            - name: rpc-epmap
              containerPort: 135
              protocol: TCP
            - name: netbios-ns
              containerPort: 137
              protocol: UDP
            - name: netbios-dgm
              containerPort: 138
              protocol: UDP
            - name: netbios-ssn
              containerPort: 139
              protocol: TCP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: cldap
              containerPort: 389
              protocol: UDP
            - name: smb
              containerPort: 445
              protocol: TCP
            - name: kpasswd-tcp
              containerPort: 464
              protocol: TCP
            - name: kpasswd-udp
              containerPort: 464
              protocol: UDP
            - name: ldaps
              containerPort: 636
              protocol: TCP
            - name: gc-tcp
              containerPort: 3268
              protocol: TCP
            - name: gc-ssl
              containerPort: 3269
              protocol: TCP
            - name: alt-dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: alt-dns-udp
              containerPort: 5353
              protocol: UDP
            - name: bind-metrics
              containerPort: 9119
              protocol: TCP
            - name: kea-metrics
              containerPort: 9547
              protocol: TCP
            - name: samba-metrics
              containerPort: 9922
              protocol: TCP
            - name: stork-agent
              containerPort: 8081
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 389), 5); s.close()"]
            periodSeconds: 10
            failureThreshold: 30
          # LDAP answers well before Kea DDNS and the Stork agent finish, so
          # readiness tracks the observability endpoints that close out bootstrap.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import socket, sys; sys.exit(any(socket.socket().connect_ex(('127.0.0.1', port)) for port in (389, 9119, 9547)))"]
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/samba
              subPath: samba
            - name: data
              mountPath: /etc/bind
              subPath: bind-config
            - name: data
              mountPath: /var/cache/bind
              subPath: bind-data
            - name: data
              mountPath: /etc/chrony
              subPath: chrony-config
            - name: data
              mountPath: /var/lib/chrony
              subPath: chrony-data
            - name: data
              mountPath: /etc/kea
              subPath: kea-config
            - name: data
              mountPath: /var/lib/kea
              subPath: kea-data
            - name: data
              mountPath: /etc/stork
              subPath: stork-config
            - name: data
              mountPath: /var/lib/stork-agent
              subPath: stork-data
            - name: data
              mountPath: /var/log
              subPath: log-data
            {{- if .Values.tls.controller.secretName }}
            - name: controller-tls
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if .Values.tls.storkServer.enabled }}
            - name: stork-server-ca
              mountPath: /etc/dib-trust/stork-server
              readOnly: true
            {{- end }}
            {{- if $ldapCASecret }}
            - name: ldap-ca
              mountPath: /etc/dib-trust/ldap
              readOnly: true
            {{- end }}
            {{- if and .Values.database.external.enabled (or .Values.database.external.tls.rootCertSecretName .Values.database.external.tls.clientCertSecretName) }}
            - name: postgresql-tls
              mountPath: /etc/stork/postgresql-tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.tls.controller.secretName }}
        - name: controller-tls
          secret:
            secretName: {{ .Values.tls.controller.secretName | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.tls.controller.certificateKey | quote }}
                path: cert.pem
              - key: {{ .Values.tls.controller.privateKeyKey | quote }}
                path: key.pem
              - key: {{ .Values.tls.controller.caKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if .Values.tls.storkServer.enabled }}
        - name: stork-server-ca
          secret:
            secretName: {{ default .Values.tls.storkServer.secretName .Values.tls.storkServer.caSecretName | quote }}
            items:
              - key: {{ .Values.tls.storkServer.caKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if $ldapCASecret }}
        - name: ldap-ca
          secret:
            secretName: {{ $ldapCASecret | quote }}
            items:
              - key: {{ .Values.tls.ldap.caKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.database.external.enabled (or .Values.database.external.tls.rootCertSecretName .Values.database.external.tls.clientCertSecretName) }}
        - name: postgresql-tls
          projected:
            defaultMode: 0400
            sources:
              {{- if .Values.database.external.tls.rootCertSecretName }}
              - secret:
                  name: {{ .Values.database.external.tls.rootCertSecretName | quote }}
                  items:
                    - key: {{ .Values.database.external.tls.rootCertKey | quote }}
                      path: ca.crt
              {{- end }}
              {{- if .Values.database.external.tls.clientCertSecretName }}
              - secret:
                  name: {{ .Values.database.external.tls.clientCertSecretName | quote }}
                  items:
                    - key: {{ .Values.database.external.tls.clientCertKey | quote }}
                      path: {{ .Values.database.external.tls.clientCertKey | quote }}
                    - key: {{ .Values.database.external.tls.clientKeyKey | quote }}
                      path: {{ .Values.database.external.tls.clientKeyKey | quote }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
