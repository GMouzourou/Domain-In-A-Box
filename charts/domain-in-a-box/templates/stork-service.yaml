{{- $port := ternary 443 80 .Values.tls.storkServer.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "domain-in-a-box.fullname" . }}-stork-server
  labels:
    {{- include "domain-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: stork-server
spec:
  selector:
    {{- include "domain-in-a-box.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stork-server
  ports:
    - name: stork-rest
      port: {{ $port }}
      targetPort: stork-rest