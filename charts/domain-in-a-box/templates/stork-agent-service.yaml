apiVersion: v1
kind: Service
metadata:
  name: {{ include "domain-in-a-box.fullname" . }}-stork-agent
  labels:
    {{- include "domain-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: stork-agent
spec:
  clusterIP: None
  # Registration must be able to reach the ping listener before the pod is ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "domain-in-a-box.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: domain-controller
  ports:
    - name: stork-agent
      port: 8081
      targetPort: stork-agent
      protocol: TCP
